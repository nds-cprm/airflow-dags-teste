name: "analise_mineralometrica"
schedule: null
description: "Dados de mineralometria"
tags: 
  - "mineralometria"
  - "postgresql"
  - "ESRI"
dagArgs: {
  # params: ""
}
etl:
  source:
    connectionName: null
    schema: "geoquimica_prospectiva"
    table: "resultados_analiticos_mineralometria"
    primaryKeyColumn: "objectid"
    geometryColumn:
      xColumn: "longitude"
      yColumn: "latitude"
      srid: 4674
    timestampColumn:
      - name: "data_de_analise"
        format: "%d/%m/%Y"
    weightColumns: 
      # colunas antigas
      - 'peso_inicial_g'
      - 'peso_fracionado_g'
      - 'peso_conc_0_3_g'
      - 'peso_bateia_0_3_g'
      - 'magnetico_ima_mao_g'
      - 'total_pesado_g'
      - 'nao_analisadas_leves_g'
      - 'semi_magnetico_g'
      - 'nao_magneticos_g'
      - 'total_analisado_g'
      # Novas colunas
      - 'peso_inicial_g'
      - 'peso_lavado_g'
      - 'peso_emb_finos_g'
      - 'peso_quarteado_g'
      - 'peso_concentrado_g'
      - 'pi_sep_magnetico_g'
      - 'magnetico_g'
      - 'semi_magnetico_g'
      - 'nao_magnetico_g'
      - 'au_semi_magnetico_g'
      - 'au_concentrado_nao_magnetico_g'
      - 'au_total_analisado_g'
      - 'atraido_ima_mao_1500_gauss'
      - 'atraido_ima_mao_7500_gauss'
      - 'nao_atraido_ima_mao_7500_gauss'
      - 'peso_total_analisado'
  destination:
    connectionName: null
    schema: "geoquimica"
    surveyTable: 
      name: "mineralometria_amostras"
      primaryKeyColumn: "fid"
      geometryColumn: "geometry"
    assayTable:
      name: "mineralometria_analises"
      indexColumns:
        - "amostra"
        - "analito"
      valueColumn: "valor"
      excludedColumns: 
        - "globalid"
        - "lote"
        - "ra"
        - "metodo"
        - "created_user"
        - "created_date"
        - "last_edited_user"
        - "last_edited_date"
    matViews:
      - arcgis.geoquimica_mineralometria_amostras
      - arcgis.geoquimica_mineralometria_analises
      - arcgis.geoquimica_mineralometria_pivot_join
